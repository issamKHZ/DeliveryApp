version: '3.4'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "Aqwxsz@1234"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    networks:
      - devnetwork

  webapi:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      - sqlserver
    ports:
      - "8080:80"
    networks:
      - devnetwork

networks:
  devnetwork:
