apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-api
  template:
    metadata:
      labels:
        app: auth-api
    spec:
      containers:
      - name: auth-api
        image: ton-image-backend:latest
        ports:
        - containerPort: 8080

---

apiVersion: v1
kind: Service
metadata:
  name: auth-api-ip
spec:
  selector:
    app: auth-api
  ports:
    - protocol: TCP
      port: 8080       
      targetPort: 8080
  type: ClusterIP

---

apiVersion: v1
kind: Service
metadata:
  name: mon-backend
spec:
  selector:
    app: auth-api-port
  ports:
    - protocol: TCP
      port: 8080       
      targetPort: 8080 
      nodePort: 30080  
  type: NodePort
