<p #ref
   [ngStyle]="computedStyle()"
   [ngClass]="{'ws-pl': whiteSpacePreLine}"
   tooltipStyleClass="full-content"
   class="{{styleClass}} {{contentClass()}}"
   [pTooltip]="(overflow)?content:undefined"
   [tooltipPosition]="tooltipPosition">
  {{content}}
</p>
